<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ATAV POS · Mobile preview</title>
    <link rel="stylesheet" href="./css/mobile-app.css?v=20261011m1" />
    <style>
      body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #fff; }
      @media (max-width: 720px) {
        body.m-preview #m-home { display: block; }
        body.m-preview #m-tabbar { display: flex; }
      }
    </style>
  </head>
  <body class="m-preview m-app analytics-home">
    <article id="m-home" class="m-home" data-recent="all">
      <header class="m-home-top">
        <div>
          <p class="m-home-kicker">ATAV POS</p>
          <h2 id="m-home-shop">Your shop</h2>
        </div>
        <button type="button" class="m-icon-btn" id="m-home-notify" aria-label="Notifications">🔔</button>
      </header>
      <div class="m-kpis">
        <button type="button"><span>Total bills</span><strong id="m-kpi-total">0</strong><em>today</em></button>
        <button type="button"><span>Paid today</span><strong id="m-kpi-paid">₹0</strong><em>last 24 hours</em></button>
        <button type="button"><span>Pending due</span><strong id="m-kpi-pending">0</strong><em>outstanding</em></button>
      </div>
      <div class="m-actions">
        <button type="button"><span class="m-tile-ico is-bill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></span>New bill</button>
        <button type="button"><span class="m-tile-ico is-inv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4"/></svg></span>Invoices</button>
        <button type="button"><span class="m-tile-ico is-cust"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><path d="M3.5 19c.6-3 3-5 5.5-5s4.9 2 5.5 5"/><circle cx="17" cy="9" r="2.2"/><path d="M16 14.2c2 .4 3.6 1.8 4.2 3.8"/></svg></span>Customers</button>
        <button type="button"><span class="m-tile-ico is-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8 12 4l8 4-8 4-8-4z"/><path d="M4 8v8l8 4 8-4V8"/><path d="M12 12v8"/></svg></span>Items</button>
        <button type="button"><span class="m-tile-ico is-exp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3h10v18H7z"/><path d="M10 8h4M10 12h4M10 16h2"/></svg></span>Expenses</button>
        <button type="button"><span class="m-tile-ico is-inc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 7v10M9 10h4.5a2 2 0 1 1 0 4H9"/></svg></span>Income</button>
      </div>
      <section class="m-recent">
        <header><h3>Recent transactions</h3></header>
        <div class="m-chips">
          <button type="button" class="is-on" data-m-recent="all">All invoices</button>
          <button type="button" data-m-recent="expenses">Expenses</button>
          <button type="button" data-m-recent="income">Income</button>
        </div>
        <ul class="m-recent-list" id="m-recent-list"></ul>
      </section>
    </article>
    <nav id="m-tabbar" class="m-tabbar" aria-label="Mobile">
      <button type="button" data-m-tab="dashboard" class="is-on"><span class="m-tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10.5 12 4l8 6.5V20H4z"/></svg></span>Home</button>
      <button type="button" data-m-tab="orders"><span class="m-tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 4h8l4 4v12H7z"/><path d="M15 4v4h4"/></svg></span>Invoices</button>
      <button type="button" data-m-tab="reports"><span class="m-tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V9h4v10H4zm6 0V5h4v14h-4zm6 0v-7h4v7h-4z"/></svg></span>Reports</button>
      <button type="button" data-m-tab="menu"><span class="m-tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7h14M5 12h14M5 17h14"/></svg></span>Menu</button>
    </nav>
    <script src="./js/mobile-app.js?v=20261011m1"></script>
    <script>
      POSMobileApp.paintHome(POSMobileApp.demoDashboard());
    </script>
  </body>
</html>

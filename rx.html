<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <title>Upload prescription · ATAV POS</title>
    <link rel="stylesheet" href="./css/rx.css?v=20260917rx1" />
  </head>
  <body>
    <header class="rx-head">
      <img id="shop-logo" alt="" hidden />
      <div>
        <p class="eyebrow">PHARMACY · PRESCRIPTION UPLOAD</p>
        <h1 id="shop-name">Opening pharmacy…</h1>
        <p id="shop-address"></p>
      </div>
    </header>
    <main>
      <form id="rx-form" hidden>
        <label>Customer Name * <input name="customer_name" maxlength="160" required autocomplete="name" /></label>
        <label>Mobile Number * <input name="mobile" maxlength="15" inputmode="tel" required autocomplete="tel" /></label>
        <fieldset class="upload-box">
          <legend>Upload Prescription 📷</legend>
          <input id="rx-camera" type="file" accept="image/*" capture="environment" hidden />
          <input id="rx-gallery" type="file" accept="image/*" hidden />
          <input id="rx-pdf" type="file" accept="application/pdf" hidden />
          <div class="upload-actions">
            <button type="button" data-pick="rx-camera">Camera</button>
            <button type="button" data-pick="rx-gallery">Gallery</button>
            <button type="button" data-pick="rx-pdf">PDF</button>
          </div>
          <p class="file-name" id="file-name">No file chosen</p>
          <img id="file-preview" alt="" hidden />
        </fieldset>
        <label>Add Note / Message <textarea name="notes" maxlength="1000" rows="3" placeholder="Optional message for the pharmacist"></textarea></label>
        <button class="submit" type="submit">Submit Prescription</button>
        <p class="form-hint" id="rx-hint"></p>
      </form>
      <section class="success-card" id="rx-success" hidden>
        <div class="success-check">✓</div>
        <p class="eyebrow">RECEIVED</p>
        <h2 id="success-number"></h2>
        <p id="success-copy">Prescription submitted successfully. Pharmacy will review it and contact you.</p>
        <button type="button" id="rx-again">Send another</button>
      </section>
      <p class="empty" id="rx-error" hidden></p>
    </main>
    <footer>Prescription upload powered by <strong>ATAV POS</strong></footer>
    <script src="./js/rx.js?v=20260917rx1" defer></script>
  </body>
</html>

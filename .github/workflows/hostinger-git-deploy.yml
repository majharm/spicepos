name: Hostinger Git deploy checks

on:
  push:
    branches:
      - main
      - cursor/qr-code-ordering-357a
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check Express entry and till scripts
        run: |
          node --check server.js
          node --check server/index.js
          node --check js/app.js
          node --check js/qr-order.js

      - name: Run unit tests
        run: npm test

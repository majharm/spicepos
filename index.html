<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spice POS</title>
    <link rel="stylesheet" href="./css/pos.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <strong id="shop-name">Spice POS</strong>
          <span id="shop-place">Counter</span>
        </div>
        <form class="search" id="search-form">
          <input
            id="search"
            type="search"
            placeholder="Search spice, SKU, or pack — / to focus"
            autocomplete="off"
          />
        </form>
        <div class="stats">
          <div class="chip">Today <b id="today-total">₹0.00</b></div>
          <div class="chip">Bills <b id="today-count">0</b></div>
          <div class="chip" id="clock">--:--</div>
        </div>
        <div class="top-actions">
          <button class="btn" id="btn-held" type="button">Held</button>
          <button class="btn" id="btn-orders" type="button">Orders</button>
          <button class="btn ghost" id="btn-lock" type="button">Lock</button>
        </div>
      </header>
      <main class="workspace">
        <section class="catalog" id="catalog" aria-label="Products"></section>
        <aside class="ticket">
          <h2>Current bill</h2>
          <div class="lines" id="lines"></div>
          <div class="totals">
            <div><span>Taxable</span><span id="taxable">₹0.00</span></div>
            <div><span>GST</span><span id="tax">₹0.00</span></div>
            <div class="grand"><span>Total</span><span id="total">₹0.00</span></div>
          </div>
          <div class="pay">
            <div class="tender">
              <input id="tender" inputmode="decimal" placeholder="Cash tendered" />
              <button class="btn" id="btn-hold" type="button">Hold</button>
              <button class="btn danger" id="btn-clear" type="button">Clear</button>
            </div>
            <div class="pay-row">
              <button class="btn primary" id="pay-cash" type="button">Cash</button>
              <button class="btn" id="pay-upi" type="button">UPI</button>
              <button class="btn" id="pay-card" type="button">Card</button>
            </div>
            <div class="hint" id="hint"></div>
          </div>
        </aside>
      </main>
    </div>

    <div class="lock" id="lock">
      <div class="dialog">
        <h3>Unlock counter</h3>
        <p>Enter cashier PIN. Demo PIN is <b>1234</b>.</p>
        <form class="pin" id="pin-form">
          <input id="pin" type="password" inputmode="numeric" maxlength="8" autofocus />
          <button class="btn primary" type="submit">Unlock</button>
        </form>
        <div class="hint" id="pin-hint"></div>
      </div>
    </div>

    <div class="modal" id="modal" hidden>
      <div class="dialog">
        <h3 id="modal-title">Dialog</h3>
        <div id="modal-body"></div>
        <div style="margin-top: 14px; display: flex; gap: 8px; justify-content: flex-end">
          <button class="btn" id="modal-close" type="button">Close</button>
        </div>
      </div>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="velocity">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <title>Master Admin · ATAV POS</title>
    <link rel="icon" href="./favicon.svg" />
    <link rel="stylesheet" href="./css/pos.css?v=20260905deploy145" />
    <link rel="stylesheet" href="./css/saas.css?v=20260905deploy138" />
  </head>
  <body class="master-locked">
    <div class="master-shell">
      <nav class="master-nav">
        <div class="master-brand">
          <img src="./assets/atav-telecom-logo.png" alt="ATAV Telecom" width="140" height="60" />
          <h1>Master Admin</h1>
        </div>
        <div class="master-nav-scroll">
          <div class="master-nav-group">
            <p class="nav-group-label">Main</p>
            <button type="button" class="active" data-tab="dash"><span class="nav-icon" aria-hidden="true">⌂</span>Dashboard</button>
            <button type="button" data-tab="biz"><span class="nav-icon" aria-hidden="true">◈</span>Businesses</button>
            <button type="button" data-tab="users"><span class="nav-icon" aria-hidden="true">◉</span>Users</button>
            <button type="button" data-tab="plans"><span class="nav-icon" aria-hidden="true">▤</span>Plans</button>
          </div>
          <div class="master-nav-group">
            <p class="nav-group-label">Alerts</p>
            <button type="button" data-tab="expiry"><span class="nav-icon" aria-hidden="true">⚑</span>Send alerts</button>
            <button type="button" data-tab="alert-log"><span class="nav-icon" aria-hidden="true">▤</span>WA & Email log</button>
          </div>
          <div class="master-nav-group">
            <p class="nav-group-label">People</p>
            <button type="button" data-tab="managers"><span class="nav-icon" aria-hidden="true">◎</span>Account managers</button>
            <button type="button" data-tab="support"><span class="nav-icon" aria-hidden="true">?</span>Support helpline</button>
          </div>
          <div class="master-nav-group">
            <p class="nav-group-label">Advance</p>
            <button type="button" data-tab="advance"><span class="nav-icon" aria-hidden="true">⚙</span>Advance</button>
            <button type="button" class="nav-sub" data-tab="backup" data-backup-pane="settings">Settings</button>
            <button type="button" class="nav-sub" data-tab="backup" data-backup-pane="backup">Backup</button>
            <button type="button" class="nav-sub" data-tab="languages">Languages</button>
            <button type="button" class="nav-sub" data-tab="notes">Messages</button>
            <button type="button" class="nav-sub" data-tab="branches">Branches</button>
            <button type="button" class="nav-sub" data-tab="devices">POS devices</button>
            <button type="button" class="nav-sub" data-tab="audit">Audit log</button>
          </div>
        </div>
        <div class="nav-foot">
          <button class="btn-logout" type="button" id="logout" data-logout>Logout</button>
        </div>
      </nav>
      <main class="master-main">
        <form id="master-login" class="auth-card" hidden>
          <h2>Master sign in</h2>
          <label>Email <input name="email" type="email" required /></label>
          <label>Password <input name="password" type="password" required /></label>
          <label class="remember">
            <input type="checkbox" name="remember" />
            <span class="remember-ui" aria-hidden="true"></span>
            Remember me
          </label>
          <button class="btn primary" type="submit">Enter</button>
          <p class="hint" id="login-hint"></p>
          <p class="hint"><a href="./setup.html">MySQL setup</a> (required once on this PHP host)</p>
        </form>
        <div id="panel" hidden>
          <h2 id="panel-title">Dashboard</h2>
          <div id="panel-body"></div>
        </div>
      </main>
    </div>
    <script src="./js/i18n-catalog.js?v=20260905deploy145" defer></script>
    <script src="./js/i18n.js?v=20260905deploy145" defer></script>
    <script src="./js/pos-api.js?v=20260905deploy154" defer></script>
    <script src="./js/support.js?v=20260905deploy138" defer></script>
    <script src="./js/master.js?v=20260905deploy147" defer></script>
  </body>
</html>

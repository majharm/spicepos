<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Order QR · ATAV POS</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Georgia, "Times New Roman", serif;
        background: #f4f7f6;
        color: #10211f;
        text-align: center;
        padding: 24px;
      }
      img.qr {
        width: min(320px, 80vw);
        height: auto;
        background: #fff;
        padding: 16px;
        border-radius: 20px;
        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.12);
      }
      h1 { margin: 0 0 8px; font-size: 28px; }
      p { color: #64748b; word-break: break-all; max-width: 32em; margin: 10px auto; }
      .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
      a, button {
        font: 600 15px/1 ui-sans-serif, system-ui, sans-serif;
        padding: 10px 16px;
        border-radius: 12px;
        border: 1px solid #dce7e4;
        background: #fff;
        color: #115e59;
        text-decoration: none;
        cursor: pointer;
      }
      button.primary, a.primary { background: #0f766e; color: #fff; border-color: transparent; }
      .err { color: #b91c1c; }
      @media print {
        .actions { display: none; }
        body { background: #fff; }
      }
    </style>
  </head>
  <body>
    <div>
      <p style="letter-spacing:0.14em;font-size:12px;font-weight:800;font-family:ui-sans-serif,system-ui">SCAN TO ORDER</p>
      <h1 id="shop-name">ATAV POS</h1>
      <img class="qr" id="qr-code-img" width="320" height="320" alt="QR code for customer ordering" hidden />
      <p id="qr-link">Preparing QR…</p>
      <div class="actions">
        <a class="primary" id="open-menu" href="./order.html">Open menu</a>
        <button class="primary" type="button" id="print-btn">Print</button>
        <a href="./">Back to till</a>
      </div>
    </div>
    <script src="./js/qrcode.iife.js?v=20260905qr1"></script>
    <script>
      const params = new URLSearchParams(location.search);
      const linkEl = document.getElementById("qr-link");
      const img = document.getElementById("qr-code-img");
      const open = document.getElementById("open-menu");

      function menuUrl(shop) {
        return new URL("order.html?shop=" + encodeURIComponent(shop), location.href).href;
      }

      function paint(url) {
        linkEl.textContent = url;
        linkEl.className = "";
        open.href = url;
        if (typeof QRCodeLib === "undefined") {
          img.hidden = false;
          img.src = "https://api.qrserver.com/v1/create-qr-code/?size=360x360&margin=8&data=" + encodeURIComponent(url);
          return;
        }
        QRCodeLib.toDataURL(url, { width: 360, margin: 1, errorCorrectionLevel: "M" })
          .then((dataUrl) => {
            img.src = dataUrl;
            img.hidden = false;
          })
          .catch(() => {
            img.hidden = false;
            img.src = "https://api.qrserver.com/v1/create-qr-code/?size=360x360&margin=8&data=" + encodeURIComponent(url);
          });
      }

      async function resolveShop() {
        const fromQuery = (params.get("shop") || "").trim();
        if (fromQuery) return fromQuery;
        try {
          const res = await fetch("/api/auth/me", { credentials: "include", headers: { Accept: "application/json" } });
          const me = await res.json().catch(() => ({}));
          return me.business?.id || me.user?.business_id || me.business?.code || "";
        } catch {
          return "";
        }
      }

      document.getElementById("print-btn").onclick = () => window.print();

      resolveShop().then(async (shop) => {
        if (!shop) {
          linkEl.className = "err";
          linkEl.textContent = "Add ?shop=YOUR_SHOP_ID to this URL, or open Poster from POS → QR Orders while signed in.";
          return;
        }
        const url = menuUrl(shop);
        paint(url);
        try {
          const res = await fetch("/api/qr/menu?shop=" + encodeURIComponent(shop), { headers: { Accept: "application/json" } });
          const data = await res.json().catch(() => ({}));
          if (data.shop?.name) document.getElementById("shop-name").textContent = data.shop.name;
        } catch {
          /* poster still works */
        }
      });
    </script>
  </body>
</html>
